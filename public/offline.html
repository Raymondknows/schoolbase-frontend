<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a66c2" />
    <title>SchoolBase offline</title>
    <style>
      :root {
        --brand: #0a66c2;
        --brand-light: #e8f4fc;
        --brand-hover: #004182;
        --foreground: #191919;
        --muted: #666666;
        --surface: #ffffff;
        --border: #e0e0e0;
        --success: #15803d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(2, 6, 23, 0.45);
        color: var(--foreground);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .card {
        width: min(100%, 512px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--brand);
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(10, 102, 194, 0.12);
      }

      .header {
        display: flex;
        align-items: flex-start;
        padding: 20px 24px;
        background: var(--brand-light);
        border-bottom: 1px solid rgba(10, 102, 194, 0.15);
      }

      .heading {
        min-width: 0;
        flex: 1;
      }

      .eyebrow-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .eyebrow {
        color: var(--brand);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 10px;
        font-weight: 700;
      }

      .pill {
        display: inline-flex;
        padding: 3px 8px;
        border-left: 1px solid var(--brand);
        padding-left: 8px;
        color: var(--success);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 4px 0 0;
        font-size: 1.25rem;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      .intro {
        padding: 24px;
      }

      .intro p {
        margin: 0;
        color: var(--foreground);
        line-height: 1.6;
        font-size: 0.9rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 8px 10px;
        border-radius: 999px;
        background: var(--brand-light);
        color: var(--brand);
        border: 1px solid rgba(10, 102, 194, 0.18);
        font-size: 12px;
        font-weight: 700;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand);
        display: inline-block;
      }

      .footer {
        display: flex;
        justify-content: flex-end;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: #f8fafc;
      }

      button {
        border: 0;
        padding: 10px 16px;
        background: var(--brand);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
      }

      button:hover { background: var(--brand-hover); }
    </style>
  </head>
  <body>
    <main class="card" role="dialog" aria-modal="true" aria-labelledby="offline-title">
      <header class="header">
        <div class="heading">
          <div class="eyebrow-row">
            <span class="eyebrow">SchoolBase</span>
            <span class="pill">Offline</span>
          </div>
          <h1 id="offline-title">You are offline</h1>
        </div>
      </header>
      <section class="intro" aria-live="polite">
        <p>Your connection has dropped. Pending attendance changes will retry automatically when the network returns.</p>
        <div class="status"><span class="dot"></span>Waiting for connection</div>
      </section>
      <footer class="footer">
        <button type="button" onclick="location.reload()">Try again</button>
      </footer>
    </main>
  </body>
</html>
